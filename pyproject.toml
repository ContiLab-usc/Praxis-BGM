[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-bgm"
version = "0.2.0"
description = "Praxis-BGM: packaged damped global-z-prior Bayesian Gaussian mixture library"
authors = [
  { name = "Qiran Jia", email = "you@example.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "jax",
  "jaxlib",
  "numpy",
  "pandas",
  "scikit-learn",
  "matplotlib",
]

[project.urls]
Homepage = "https://github.com/ContiLab-usc/Praxis-BGM"
Repository = "https://github.com/ContiLab-usc/Praxis-BGM"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
