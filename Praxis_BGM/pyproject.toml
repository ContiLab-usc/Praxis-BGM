[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-bgm"
version = "0.1.0"
description = "Praxis-BGM: Prior-augmented Bayesian Gaussian Mixture with NGVI and structural precision/covariance masks"
authors = [
  { name = "Qiran Jia", email = "you@example.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "jax",
  "jaxlib",
  "numpy",
  "scikit-learn",
  "matplotlib",
]

[project.urls]
Homepage = "https://github.com/yourname/praxis-bgm"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]